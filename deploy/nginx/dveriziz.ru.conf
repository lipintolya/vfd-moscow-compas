# Рабочая конфигурация: только https://dveriziz.ru, всё остальное — 301 туда.
# Сертификат Let's Encrypt (certbot, webroot), продление — certbot.timer,
# после продления nginx перечитывает сертификат (deploy-hook).
# HTTP/2 — в listen: в nginx 1.24 (Ubuntu 24.04) директивы http2 on ещё нет.

# http → https; проверка Let's Encrypt — по http
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dveriziz.ru www.dveriziz.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://dveriziz.ru$request_uri;
    }
}

# www → без www (один адрес сайта для поисковиков)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dveriziz.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/dveriziz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dveriziz.ru/privkey.pem;
    include /etc/nginx/snippets/dveriziz-ssl.conf;

    return 301 https://dveriziz.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name dveriziz.ru;

    ssl_certificate     /etc/letsencrypt/live/dveriziz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dveriziz.ru/privkey.pem;
    include /etc/nginx/snippets/dveriziz-ssl.conf;

    include /etc/nginx/snippets/dveriziz-site.conf;
}
