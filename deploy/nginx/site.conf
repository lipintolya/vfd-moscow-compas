# Сайт dveriziz.ru — общие правила для http- и https-версии конфигурации.
# Готовые страницы (dist/) и фото Strapi (/uploads/) кладёт сюда
# npm run deploy (scripts/deploy-site.mjs).
root /var/www/dveriziz.ru/public;
index index.html;
charset utf-8;
server_tokens off;
# Редирект /articles → /articles/ — относительным адресом (без схемы и порта)
absolute_redirect off;

include /etc/nginx/snippets/dveriziz-headers.conf;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml;

# Скрытые файлы (.git, .env и т.п.) не отдаём, даже если попадут в каталог.
# Префиксные location с ^~ (/_astro/, /uploads/ и др.) по правилам nginx сильнее регулярного
location ~ /\. {
    return 404;
}

# Прежние адреса акций (до 11.11.2026) — постоянный редирект на новые:
# ссылки и закладки не ломаются, поисковики переносят адрес в выдаче
location ~ ^/akcii/?$ {
    return 301 /offers/;
}
location ~ ^/promo-archive/?$ {
    return 301 /offers/archive/;
}

# /index.html и /раздел/index.html — копии страниц по второму адресу:
# постоянный редирект на адрес со слешем (12 Nov 2026, аудит). Проверяется
# $request_uri — исходный запрос, а не внутренний переход директивы index,
# иначе запрос «/» ушёл бы в бесконечный редирект
if ($request_uri ~ "^(/(?:[^?]*/)?)index\.html(?:\?.*)?$") {
    return 301 $1;
}

# Страницы — браузер каждый раз сверяется с сервером (ETag, ответ 304 без
# тела, если не менялась): после npm run deploy посетители сразу видят новое
location / {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

# Файлы сборки с хешем в имени и шрифты не меняются — год
location ^~ /_astro/ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ^~ /fonts/ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
# Фото Strapi — имя с хешем, при замене фото меняется — 30 дней
location ^~ /uploads/ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
# Манифест (/favicons/site.webmanifest) — со своим типом; до правила
# для картинок: регулярные location проверяются по порядку
location ~ \.webmanifest$ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
# Копии с хешем в имени (…-1a2b3c4d.webp, …-1a2b3c4d-640.webp,
# …-640-1a2b3c4d.webp — генераторы scripts/gen-*.mjs): заменили исходник —
# сменилось имя, поэтому год без перепроверки (PageSpeed, 12 Nov 2026).
# Регулярное выражение — в кавычках: без них nginx читает «{» как начало блока
location ~* "^/(renders|og)/.*-[0-9a-f]{8}(?:-[0-9]+)?\.(?:webp|avif|jpe?g|png)$" {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
# Значки мессенджеров — только со ссылкой …?v=N (src/lib/messenger-icons.ts):
# заменили файл — подняли N, поэтому год
location ^~ /icons/ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
# Остальные фото страниц и каталога — имена постоянные, при замене файла
# кэш должен обновиться за разумное время — 30 дней (было 7)
location ~* ^/(media|renders|og|favicons|svg|pdf)/ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# Иконки сайта в корне — тоже неделя
location ~* ^/(favicon\.ico|apple-touch-icon\.png|logo-schema\.png)$ {
    include /etc/nginx/snippets/dveriziz-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    include /etc/nginx/snippets/dveriziz-headers.conf;
}
