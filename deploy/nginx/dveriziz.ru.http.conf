# Временная конфигурация — до выпуска HTTPS-сертификата (только http).
# После certbot заменяется на dveriziz.ru.conf (deploy/setup-server.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dveriziz.ru www.dveriziz.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include /etc/nginx/snippets/dveriziz-site.conf;
}
